<!DOCTYPE html>
<html lang="pl">
<head>

  <!-- TODO: dodaj meta viewport dla responsywności -->
  <title>Moja galeria</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Moja galeria zdjęć</h1>

  <nav>

    <div class="photo-item">

    </div>

      <img src="images/img (5).jpg" alt="Las">

    </div>

      <img src="images/img (6).jpg" alt="Rzeka">
